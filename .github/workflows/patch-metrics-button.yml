name: Apply duplicate submission safeguard

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-metrics-button.yml
      - .github/scripts/prevent_duplicate_submissions.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply duplicate submission safeguard
        run: python .github/scripts/prevent_duplicate_submissions.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/index.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Prevent duplicate posts in the same campaign"
            git push
          fi
