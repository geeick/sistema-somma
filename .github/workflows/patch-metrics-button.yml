name: Patch metrics button to platform APIs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-metrics-button.yml
      - .github/scripts/patch_metrics_button.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python .github/scripts/patch_metrics_button.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/SubmissionsAdmin.tsx server/src/index.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Use platform APIs for admin metric refresh"
            git push
          fi
