name: Prevent negative campaign balances

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prevent-negative-balances.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply campaign budget safeguards
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          # 1) UI: never render a negative remaining campaign budget.
          campaigns_path = Path('src/pages/admin/CampaignsAdmin.tsx')
          campaigns = campaigns_path.read_text()
          old_remaining = "const remainingBudget = budget - totalPayout;"
          new_remaining = "const remainingBudget = Math.max(0, budget - totalPayout);"
          if old_remaining not in campaigns:
              raise SystemExit('Could not find remainingBudget calculation')
          campaigns = campaigns.replace(old_remaining, new_remaining, 1)
          campaigns_path.write_text(campaigns)

          server_path = Path('server/src/index.js')
          server = server_path.read_text()

          # 2) Campaign totals: avoid join multiplication and count spend only
          # when a submission is actually approved/paid.
          list_pattern = re.compile(
              r"app\.get\('/api/admin/campaigns', verifyToken, requireAdmin, async \(_req, res\) => \{.*?\n\}\);\n\n(?=app\.get\('/api/admin/campaigns/:id')",
              re.S,
          )
          list_route = r'''app.get('/api/admin/campaigns', verifyToken, requireAdmin, async (_req, res) => {
            try {
              const result = await pool.query(
                `
                SELECT
                  c.*,
                  (
                    SELECT COUNT(*)::int
                    FROM submissions s
                    WHERE s.campaign_id = c.id
                      AND LOWER(COALESCE(s.status, '')) <> 'deleted'
                  ) AS submission_count,
                  (
                    SELECT COUNT(*)::int
                    FROM campaign_participants cp
                    WHERE cp.campaign_id = c.id
                  ) AS participant_count,
                  COALESCE((
                    SELECT SUM(COALESCE(s.views_count, 0))
                    FROM submissions s
                    WHERE s.campaign_id = c.id
                      AND LOWER(COALESCE(s.status, '')) <> 'deleted'
                  ), 0)::bigint AS total_views,
                  COALESCE((
                    SELECT SUM(COALESCE(s.payment_amount, 0))
                    FROM submissions s
                    WHERE s.campaign_id = c.id
                      AND LOWER(COALESCE(s.status, '')) IN ('approved', 'paid')
                  ), 0)::numeric AS total_payout
                FROM campaigns c
                ORDER BY c.created_at DESC
                `
              );

              res.json({ data: result.rows });
            } catch (err) {
              console.error('Admin campaigns list error', err);
              res.status(500).json({ error: 'DB error' });
            }
          });

'''
          server, count = list_pattern.subn(list_route, server, count=1)
          if count != 1:
              raise SystemExit(f'Expected one admin campaign list route, replaced {count}')

          # 3) Do not let an admin lower a campaign budget below money that is
          # already committed to approved or paid submissions.
          put_start = "app.put('/api/admin/campaigns/:id', verifyToken, requireAdmin, async (req, res) => {"
          put_idx = server.find(put_start)
          if put_idx < 0:
              raise SystemExit('Could not find admin campaign update route')
          put_query_idx = server.find('    const result = await pool.query(', put_idx)
          if put_query_idx < 0:
              raise SystemExit('Could not find campaign update query')

          budget_guard = r'''    const requestedBudget = Number(budget);

    if (!Number.isFinite(requestedBudget) || requestedBudget < 0) {
      return res.status(400).json({
        error: 'O orçamento da campanha deve ser um valor maior ou igual a zero.',
        code: 'INVALID_CAMPAIGN_BUDGET',
      });
    }

    const committedResult = await pool.query(
      `
      SELECT COALESCE(SUM(COALESCE(payment_amount, 0)), 0)::numeric AS committed
      FROM submissions
      WHERE campaign_id = $1
        AND LOWER(COALESCE(status, '')) IN ('approved', 'paid')
      `,
      [req.params.id]
    );
    const committedPayout = Number(committedResult.rows[0]?.committed || 0);

    if (requestedBudget + 0.000001 < committedPayout) {
      return res.status(409).json({
        error: `O orçamento não pode ser menor que o valor já comprometido (R$ ${committedPayout.toFixed(2)}).`,
        code: 'BUDGET_BELOW_COMMITTED_PAYOUTS',
        committed: committedPayout,
        requested_budget: requestedBudget,
      });
    }

'''
          server = server[:put_query_idx] + budget_guard + server[put_query_idx:]

          # 4) Make approval/payment updates transactional and reject any update
          # that would push committed campaign payouts over the campaign budget.
          submission_patch_pattern = re.compile(
              r"app\.patch\('/api/admin/submissions/:id', verifyToken, requireAdmin, async \(req, res\) => \{.*?\n\}\);\n\n(?=app\.patch\('/api/admin/submissions/:id/metrics')",
              re.S,
          )
          submission_patch_route = r'''app.patch('/api/admin/submissions/:id', verifyToken, requireAdmin, async (req, res) => {
            const client = await pool.connect();

            try {
              const { status, views_count, likes_count, payment_amount, audio_verified } = req.body;
              await client.query('BEGIN');

              const currentResult = await client.query(
                `SELECT * FROM submissions WHERE id = $1 FOR UPDATE`,
                [req.params.id]
              );
              const current = currentResult.rows[0];

              if (!current) {
                await client.query('ROLLBACK');
                return res.status(404).json({ error: 'Submission not found' });
              }

              const nextStatus = status ?? current.status;
              const nextPayment = payment_amount === null || payment_amount === undefined
                ? Number(current.payment_amount || 0)
                : Number(payment_amount);

              if (!Number.isFinite(nextPayment) || nextPayment < 0) {
                await client.query('ROLLBACK');
                return res.status(400).json({
                  error: 'O valor de pagamento não pode ser negativo.',
                  code: 'INVALID_PAYMENT_AMOUNT',
                });
              }

              if (
                current.campaign_id &&
                ['approved', 'paid'].includes(String(nextStatus || '').toLowerCase())
              ) {
                // Lock the campaign row so simultaneous approvals cannot both
                // spend the same remaining budget.
                const campaignResult = await client.query(
                  `SELECT id, budget FROM campaigns WHERE id = $1 FOR UPDATE`,
                  [current.campaign_id]
                );
                const campaign = campaignResult.rows[0];

                if (campaign) {
                  const committedResult = await client.query(
                    `
                    SELECT COALESCE(SUM(COALESCE(payment_amount, 0)), 0)::numeric AS committed
                    FROM submissions
                    WHERE campaign_id = $1
                      AND id <> $2
                      AND LOWER(COALESCE(status, '')) IN ('approved', 'paid')
                    `,
                    [current.campaign_id, current.id]
                  );

                  const budget = Math.max(0, Number(campaign.budget || 0));
                  const committed = Number(committedResult.rows[0]?.committed || 0);
                  const available = Math.max(0, budget - committed);

                  if (nextPayment > available + 0.000001) {
                    await client.query('ROLLBACK');
                    return res.status(409).json({
                      error: `Não é possível aprovar este envio. O pagamento é de R$ ${nextPayment.toFixed(2)}, mas restam apenas R$ ${available.toFixed(2)} no orçamento da campanha.`,
                      code: 'CAMPAIGN_BUDGET_EXCEEDED',
                      payment_amount: nextPayment,
                      available_budget: available,
                      campaign_budget: budget,
                      committed_budget: committed,
                    });
                  }
                }
              }

              const result = await client.query(
                `
                UPDATE submissions
                SET
                  status = COALESCE($2, status),
                  views_count = COALESCE($3, views_count),
                  likes_count = COALESCE($4, likes_count),
                  payment_amount = COALESCE($5, payment_amount),
                  audio_verified = COALESCE($6, audio_verified)
                WHERE id = $1
                RETURNING *
                `,
                [
                  req.params.id,
                  status ?? null,
                  views_count ?? null,
                  likes_count ?? null,
                  payment_amount ?? null,
                  audio_verified ?? null,
                ]
              );

              await client.query('COMMIT');
              res.json({ data: result.rows[0] || null });
            } catch (err) {
              await client.query('ROLLBACK').catch(() => {});
              console.error('Admin submission update error', err);
              res.status(500).json({ error: 'DB error', details: err.message });
            } finally {
              client.release();
            }
          });

'''
          server, count = submission_patch_pattern.subn(submission_patch_route, server, count=1)
          if count != 1:
              raise SystemExit(f'Expected one admin submission patch route, replaced {count}')

          # 5) Once a submission is approved/paid, metric refreshes may continue
          # updating views/likes, but its committed payout is frozen. This keeps
          # later API metric growth from silently overspending the campaign.
          manual_start = server.find("app.patch('/api/admin/submissions/:id/metrics'")
          manual_end = server.find("app.post('/api/admin/submissions/:id/sync-metrics'", manual_start)
          if manual_start < 0 or manual_end < 0:
              raise SystemExit('Could not locate manual metrics route')
          manual_segment = server[manual_start:manual_end]
          old_manual_payment = '        payment_amount = $5,'
          new_manual_payment = "        payment_amount = CASE WHEN LOWER(COALESCE(status, '')) IN ('approved', 'paid') THEN payment_amount ELSE $5 END,"
          if old_manual_payment not in manual_segment:
              raise SystemExit('Could not locate manual metrics payment update')
          manual_segment = manual_segment.replace(old_manual_payment, new_manual_payment, 1)
          server = server[:manual_start] + manual_segment + server[manual_end:]

          sync_start = server.find("app.post('/api/admin/submissions/:id/sync-metrics'")
          sync_end = server.find("app.get('/api/admin/google-sheets-metrics'", sync_start)
          if sync_start < 0 or sync_end < 0:
              raise SystemExit('Could not locate API sync metrics route')
          sync_segment = server[sync_start:sync_end]

          # Instagram branch uses a CASE already.
          sync_segment, instagram_count = re.subn(
              r"payment_amount = CASE\s+WHEN \$7::numeric IS NULL THEN payment_amount\s+ELSE \$7::numeric\s+END,",
              "payment_amount = CASE\n                    WHEN LOWER(COALESCE(status, '')) IN ('approved', 'paid') THEN payment_amount\n                    WHEN $7::numeric IS NULL THEN payment_amount\n                    ELSE $7::numeric\n                  END,",
              sync_segment,
              count=1,
          )
          # TikTok/YouTube branches use direct assignments.
          sync_segment = sync_segment.replace(
              'payment_amount = $8,',
              "payment_amount = CASE WHEN LOWER(COALESCE(status, '')) IN ('approved', 'paid') THEN payment_amount ELSE $8 END,",
              1,
          )
          sync_segment = sync_segment.replace(
              'payment_amount = $6,',
              "payment_amount = CASE WHEN LOWER(COALESCE(status, '')) IN ('approved', 'paid') THEN payment_amount ELSE $6 END,",
              1,
          )
          if instagram_count != 1:
              raise SystemExit('Could not patch Instagram sync payout freeze')
          server = server[:sync_start] + sync_segment + server[sync_end:]

          server_path.write_text(server)

          # Apply the same post-approval payout freeze to the background worker.
          worker_path = Path('server/src/metrics-auto-sync.cjs')
          worker = worker_path.read_text()
          worker, instagram_worker_count = re.subn(
              r"payment_amount = CASE\s+WHEN \$7::numeric IS NULL THEN payment_amount\s+ELSE \$7::numeric\s+END,",
              "payment_amount = CASE\n          WHEN LOWER(COALESCE(status, '')) IN ('approved', 'paid') THEN payment_amount\n          WHEN $7::numeric IS NULL THEN payment_amount\n          ELSE $7::numeric\n        END,",
              worker,
              count=1,
          )
          if instagram_worker_count != 1:
              raise SystemExit('Could not patch worker Instagram payout')

          if 'payment_amount = $8,' not in worker:
              raise SystemExit('Could not patch worker TikTok payout')
          worker = worker.replace(
              'payment_amount = $8,',
              "payment_amount = CASE WHEN LOWER(COALESCE(status, '')) IN ('approved', 'paid') THEN payment_amount ELSE $8 END,",
              1,
          )

          if 'payment_amount = $6,' not in worker:
              raise SystemExit('Could not patch worker YouTube payout')
          worker = worker.replace(
              'payment_amount = $6,',
              "payment_amount = CASE WHEN LOWER(COALESCE(status, '')) IN ('approved', 'paid') THEN payment_amount ELSE $6 END,",
              1,
          )
          worker_path.write_text(worker)
          PY

      - name: Commit safeguards and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/CampaignsAdmin.tsx server/src/index.js server/src/metrics-auto-sync.cjs
          git rm -f .github/workflows/prevent-negative-balances.yml
          git commit -m "Prevent campaign budgets from going negative"
          git push
